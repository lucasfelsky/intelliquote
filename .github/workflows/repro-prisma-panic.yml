name: Repro Prisma engine panic (TEMPORARIO)

# Workflow temporario de evidencia do PR fix/ci-prisma-engine-panic. Sera removido antes do merge.
# baseline = config sem setupFiles (comportamento da main); guard = vitest.config.ts do PR.
# synthetic = 40 arquivos que so importam src/lib/prisma e terminam apos i ms (varre a janela da corrida).

on:
  push:
    branches: ['fix/ci-prisma-engine-panic']
  workflow_dispatch:

jobs:
  repro:
    name: ${{ matrix.mode }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, guard]
        target: [synthetic, suite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: programa/package-lock.json
      - name: Install
        working-directory: programa
        run: npm ci && npx prisma generate
      - name: Prepare
        working-directory: programa
        run: |
          if [ "${{ matrix.mode }}" = "baseline" ]; then
            printf "import { defineConfig } from 'vitest/config'\nexport default defineConfig({ test: { include: ['tests/**/*.test.ts'], exclude: ['tests/e2e/**', 'node_modules/**', 'dist/**', 'tests/prisma-guard.test.ts'] } })\n" > vitest.repro.config.ts
          else
            cp vitest.config.ts vitest.repro.config.ts
          fi
          if [ "${{ matrix.target }}" = "synthetic" ]; then
            mkdir -p tests/_repro
            for i in $(seq 1 40); do
              printf "import { it, expect } from 'vitest';\nimport { prisma } from '../../src/lib/prisma';\nit('noop', async () => { await new Promise((r) => setTimeout(r, $i)); expect(prisma).toBeTruthy(); });\n" > tests/_repro/r$i.test.ts
            done
          fi
      - name: Loop
        working-directory: programa
        run: |
          if [ "${{ matrix.target }}" = "synthetic" ]; then N=30; ARGS="tests/_repro"; else N=12; ARGS=""; fi
          fails=0; panics=0
          for n in $(seq 1 $N); do
            set +e
            npx vitest run --pool=threads --config vitest.repro.config.ts $ARGS > run.log 2>&1
            code=$?
            set -e
            p=$(grep -c "panicked at query-engine" run.log || true)
            [ "$code" -ne 0 ] && fails=$((fails+1))
            [ "$p" -gt 0 ] && panics=$((panics+1))
            echo "iter $n exit=$code panic=$p $(grep -a 'Test Files' run.log | sed 's/\x1b\[[0-9;]*m//g')"
            if [ "$code" -ne 0 ] && [ "$p" -eq 0 ]; then tail -40 run.log; fi
          done
          echo "### ${{ matrix.mode }} / ${{ matrix.target }}: $N iteracoes, $fails com exit != 0, $panics com panic da engine" >> "$GITHUB_STEP_SUMMARY"
          echo "RESULT mode=${{ matrix.mode }} target=${{ matrix.target }} iterations=$N fails=$fails panics=$panics"
