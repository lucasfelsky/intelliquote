# Deploy do backend IntelliQuote (r46) para o Cloud Run.
#
# Esse workflow NAO depende de `gcloud` ou Docker local: usa Cloud Build
# oficial e ja autentica via Workload Identity Federation.
#
# Gatilhos:
#   - manual (workflow_dispatch) com campo `tag` (ex: r46-20260619)
#   - push de tag no formato `backend-v*` (ex: backend-v46)
#
# Pre-requisitos no GitHub (secrets):
#   - GCP_WORKLOAD_IDENTITY_PROVIDER  (resource name do WIF provider, ex.:
#     projects/705697815580/locations/global/workloadIdentityPools/github-pool/providers/github-provider)
#   - GCP_SERVICE_ACCOUNT              (email da SA com permissoes de deploy, ex.:
#     github-actions-deployer@PROJECT.iam.gserviceaccount.com)
# Variaveis (Settings > Variables):
#   - GCP_PROJECT_ID, GCP_REGION, GCP_ARTIFACT_REPO, GCP_CLOUD_RUN_SERVICE.
# Nenhum segredo de aplicacao fica no GitHub: os valores sao lidos direto do
# GCP Secret Manager via `--set-secrets` (mesmo modelo do deploy manual via
# `deploy-cloudrun.ps1`). Os secrets precisam existir no projeto com estes nomes
# exatos: DATABASE_URL, DIRECT_URL, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, SMTP_FROM, SMTP_HOST, SMTP_PASS, SMTP_PORT, SMTP_USER.
#
# Pre-requisitos no GCP:
#   - Cloud Run API habilitada
#   - Artifact Registry com o repo `intelliquote` na regiao
#   - Service account com roles: Cloud Run Admin, Artifact Registry Writer,
#     Service Account User, Logging Log Writer.
#   - WIF pool + provider configurados para o repo.
#
# O build da imagem acontece direto no runner (ubuntu-latest ja tem Docker).
# Essa abordagem evita o bucket GCS que o `gcloud builds submit` exige, que
# o GitHub runner nao consegue acessar via WIF de forma confiavel.
#
# Gate de CI: o job `ci-gate` bloqueia o deploy se o commit nao estiver contido
# na main com o workflow "CI" (push/main) verde (jobs `Unit + Build` e
# `E2E (Playwright)`); se o CI ainda roda, espera ate ~25 min. Escape hatch so via
# workflow_dispatch: skip_ci_gate=true + skip_ci_gate_reason (logado). Enquanto o
# gate espera, uma 2a execucao fica pendente (concurrency sem cancel-in-progress).

name: Deploy backend (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem (ex: r46-20260619). Padrao: latest."
        required: false
        default: "latest"
      backend_build_tag:
        description: "Valor de BACKEND_BUILD_TAG (ex: 2026-06-19-r46-catalog-items-admin). Padrao: igual a tag."
        required: false
        default: ""
      skip_ci_gate:
        description: "EMERGENCIA: pula o gate de CI verde na main. Exige skip_ci_gate_reason."
        type: boolean
        required: false
        default: false
      skip_ci_gate_reason:
        description: "Motivo do skip do gate de CI (obrigatorio se skip_ci_gate=true; fica logado)."
        type: string
        required: false
        default: ""
  push:
    tags:
      - "backend-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-intelliquote-api
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO }}
  GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}

# Variáveis e secrets do GitHub às vezes vêm com whitespace acidental;
# normaliza no inicio do job para não dar "invalid project id".
jobs:
  ci-gate:
    name: Gate - CI verde na main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout (so scripts do gate)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Decidir modo (gate ou skip explicito)
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SKIP: ${{ inputs.skip_ci_gate }}
          REASON: ${{ inputs.skip_ci_gate_reason }}
        run: |
          skip=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SKIP" = "true" ]; then
            skip=true
            if [ -z "${REASON//[[:space:]]/}" ]; then
              echo "::error::skip_ci_gate=true exige skip_ci_gate_reason preenchido."
              exit 1
            fi
            # Motivo vindo da API pode ter quebra de linha: achata para nao injetar workflow commands.
            REASON="${REASON//$'\r'/ }"
            REASON="${REASON//$'\n'/ }"
            sha="$(git rev-parse HEAD)"
            echo "::warning::Gate de CI PULADO por $GITHUB_ACTOR em $sha: $REASON"
            {
              echo "### Gate de CI PULADO"
              echo "- Ator: $GITHUB_ACTOR"
              echo "- Commit: $sha"
              echo "- Motivo: $REASON"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Aguardar CI verde na main
        if: steps.mode.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/wait-ci-green.mjs --sha "$(git rev-parse HEAD)" --branch main --workflow ci.yml

  build-and-deploy:
    name: Build (Cloud Build) + Deploy (Cloud Run)
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trim de variáveis (defesa contra whitespace)
        shell: bash
        run: |
          printf '%s\n' "GCP_PROJECT_ID=${GCP_PROJECT_ID// /}" >> "$GITHUB_ENV"
          printf '%s\n' "GCP_REGION=${GCP_REGION// /}" >> "$GITHUB_ENV"
          printf '%s\n' "GCP_ARTIFACT_REPO=${GCP_ARTIFACT_REPO// /}" >> "$GITHUB_ENV"
          printf '%s\n' "GCP_CLOUD_RUN_SERVICE=${GCP_CLOUD_RUN_SERVICE// /}" >> "$GITHUB_ENV"
          echo "Trimmed envs:"
          env | grep '^GCP_'

      - name: Resolver tag e build tag
        id: tags
        shell: bash
        # Inputs via env (nunca ${{ }} dentro de run:) para evitar injecao de expressao.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BACKEND_BUILD_TAG: ${{ inputs.backend_build_tag }}
        run: |
          if [ "$EVENT" = "push" ]; then
            REF="${GITHUB_REF_NAME}"
            echo "image_tag=${REF#backend-v}" >> "$GITHUB_OUTPUT"
            echo "backend_build_tag=${REF#backend-v}" >> "$GITHUB_OUTPUT"
          else
            IMAGE_TAG="$INPUT_TAG"
            BACKEND_BUILD_TAG="$INPUT_BACKEND_BUILD_TAG"
            for v in "$IMAGE_TAG" "$BACKEND_BUILD_TAG"; do
              if [ -n "$v" ] && ! [[ "$v" =~ ^[A-Za-z0-9._-]+$ ]]; then
                echo "::error::tag/backend_build_tag invalido (permitido: letras, numeros, . _ -)."
                exit 1
              fi
            done
            if [ -z "$BACKEND_BUILD_TAG" ]; then
              BACKEND_BUILD_TAG="$IMAGE_TAG"
            fi
            echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
            echo "backend_build_tag=${BACKEND_BUILD_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Autenticar no Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Setup gcloud (Cloud Build ja autenticado)
        uses: google-github-actions/setup-gcloud@v2
        env:
          CLOUDSDK_AUTH_TOKEN: ${{ steps.auth.outputs.access_token }}
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build (Docker local) + Push (Artifact Registry)
        id: build
        shell: bash
        env:
          CLOUDSDK_AUTH_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          # O Cloud Build exige permissao num bucket GCS que o GitHub runner
          # nao tem — em vez disso construimos a imagem direto no runner e
          # empurramos para o Artifact Registry via WIF + gcloud auth.
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

          cd programa
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPO}/${GCP_CLOUD_RUN_SERVICE}:${{ steps.tags.outputs.image_tag }}"
          echo "Building ${IMAGE}"
          docker build \
            --tag "${IMAGE}" \
            --label "io.intelliquote.build-tag=${{ steps.tags.outputs.backend_build_tag }}" \
            --label "io.intelliquote.git-sha=${GITHUB_SHA}" \
            --file Dockerfile \
            .
          echo "Pushing ${IMAGE}"
          docker push "${IMAGE}"
          cd ..
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Deploy no Cloud Run
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.build.outputs.image }}"
          SERVICE="${{ env.GCP_CLOUD_RUN_SERVICE }}"
          REGION="${{ env.GCP_REGION }}"
          PROJECT="${{ env.GCP_PROJECT_ID }}"
          BUILD_TAG="${{ steps.tags.outputs.backend_build_tag }}"

          # --set-env-vars nao aceita virgulas dentro do valor (o que explode
          # quando CORS_ORIGINS tem varias URLs separadas por virgula).
          # Solucao: gerar um YAML temporario a partir de deploy-env-vars.yaml
          # (commitado), substituindo o BACKEND_BUILD_TAG pelo valor desta
          # run. --env-vars-file e --update-env-vars sao mutuamente exclusivos,
          # entao nao da pra usar os dois.
          ENV_VARS_FILE_TEMPLATE="programa/deploy-env-vars.yaml"
          if [ ! -f "$ENV_VARS_FILE_TEMPLATE" ]; then
            echo "::error::$ENV_VARS_FILE_TEMPLATE nao encontrado."
            exit 1
          fi
          ENV_VARS_FILE="/tmp/deploy-env-vars.yaml"
          # Aspas obrigatorias: gcloud --env-vars-file exige valores string.
          # Sem elas, uma tag numerica (ex: backend-v80 -> 80) e' lida como
          # int pelo parser YAML e o deploy falha ("must be strings").
          sed "s|BACKEND_BUILD_TAG: \"placeholder\"|BACKEND_BUILD_TAG: \"${BUILD_TAG}\"|" \
            "${ENV_VARS_FILE_TEMPLATE}" > "${ENV_VARS_FILE}"
          echo "Env vars file:"
          cat "${ENV_VARS_FILE}"

          SECRET_REFS="SMTP_PASS=SMTP_PASS:latest"
          SECRET_REFS="${SECRET_REFS},SMTP_HOST=SMTP_HOST:latest"
          SECRET_REFS="${SECRET_REFS},SMTP_USER=SMTP_USER:latest"
          SECRET_REFS="${SECRET_REFS},SMTP_PORT=SMTP_PORT:latest"
          SECRET_REFS="${SECRET_REFS},SMTP_FROM=SMTP_FROM:latest"
          SECRET_REFS="${SECRET_REFS},DATABASE_URL=DATABASE_URL:latest"
          SECRET_REFS="${SECRET_REFS},DIRECT_URL=DIRECT_URL:latest"
          SECRET_REFS="${SECRET_REFS},JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest"
          SECRET_REFS="${SECRET_REFS},JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest"
          # Firebase Admin usa ADC da SA de runtime do Cloud Run; nenhum secret de SA e injetado.

          echo "Deploying ${IMAGE} to ${SERVICE} (${REGION})"
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300 \
            --env-vars-file="${ENV_VARS_FILE}" \
            --set-secrets="${SECRET_REFS}" \
            --quiet
          URL=$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Service URL: ${URL}"

      - name: Smoke test (health + catalogo + buildTag no ar)
        if: success()
        shell: bash
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Health check em ${URL}/health/ready"
          HTTP=$(curl -s -o /tmp/h.json -w '%{http_code}' "${URL}/health/ready" || true)
          cat /tmp/h.json
          echo
          if [ "$HTTP" != "200" ]; then
            echo "::error::Backend health check falhou (HTTP ${HTTP})"
            exit 1
          fi
          echo "GET ${URL}/api/v1/catalog-items?pageSize=1 (esperado 401 sem auth, NAO 404)"
          HTTP2=$(curl -s -o /tmp/c.json -w '%{http_code}' "${URL}/api/v1/catalog-items?pageSize=1" || true)
          cat /tmp/c.json
          echo
          if [ "$HTTP2" = "404" ]; then
            echo "::error::Endpoint /api/v1/catalog-items nao registrado (HTTP 404)."
            exit 1
          fi
          # A revisao nova pode subir Ready mas com 0% de trafego (ex.: trafego
          # fixado numa revisao antiga por deploy manual) e o `gcloud run deploy`
          # ainda imprime "serving 100 percent" do nome da revisao antiga. So o
          # buildTag servido de verdade prova que o codigo desta tag esta no ar.
          EXPECTED_TAG="${{ steps.tags.outputs.backend_build_tag }}"
          SERVED_TAG=""
          for attempt in 1 2 3 4 5 6; do
            SERVED_TAG=$(curl -s "${URL}/health" | jq -r '.buildTag // empty' || true)
            echo "Tentativa ${attempt}: buildTag servido=\"${SERVED_TAG}\" esperado=\"${EXPECTED_TAG}\""
            if [ "$SERVED_TAG" = "$EXPECTED_TAG" ]; then
              break
            fi
            sleep 10
          done
          if [ "$SERVED_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Producao serve buildTag \"${SERVED_TAG}\", esperado \"${EXPECTED_TAG}\". A revisao nova provavelmente ficou sem trafego (trafego fixado em revisao antiga). Cloud Run > ${GCP_CLOUD_RUN_SERVICE} > Gerenciar trafego > 100% na revisao mais recente."
            exit 1
          fi
